<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枠連 投資フルツール</title>
<style>
body { font-family: sans-serif; padding: 15px; background:#111; color:#fff; }
input, select { width: 100%; padding: 10px; margin: 8px 0; }
button { width: 100%; padding: 12px; background: #00c853; color: #fff; border: none; font-size: 16px; }
.box { margin-top: 15px; padding: 10px; background:#222; border-radius:8px; white-space:pre-line; }
</style>
</head>
<body>

<h2>枠連 投資フルツール</h2>

<label>① 出走頭数</label>
<select id="head">
<option value="small">8〜10頭</option>
<option value="mid">11〜14頭</option>
<option value="large">15〜18頭</option>
</select>

<label>② 1番人気の枠</label>
<input type="number" id="r1" min="1" max="8">

<label>③ 2番人気の枠</label>
<input type="number" id="r2" min="1" max="8">

<label>④ 3番人気の枠</label>
<input type="number" id="r3" min="1" max="8">

<label>⑤ 1番人気オッズ</label>
<input type="number" id="o1" step="0.1">

<label>⑥ 2番人気オッズ</label>
<input type="number" id="o2" step="0.1">

<hr>

<label>⑦ 1番人気 騎手</label>
<select id="j1">

<option value="S">C.ルメール</option>
<option value="S">川田将雅</option>
<option value="S">戸崎圭太</option>
<option value="S">武豊</option>
<option value="S">横山武史</option>
<option value="S">松山弘平</option>

<option value="A">坂井瑠星</option>
<option value="A">菅原明良</option>
<option value="A">岩田望来</option>
<option value="A">田辺裕信</option>
<option value="A">和田竜二</option>
<option value="A">幸英明</option>
<option value="A">三浦皇成</option>
<option value="A">横山和生</option>
<option value="A">藤岡佑介</option>
<option value="A">鮫島克駿</option>
<option value="A">北村友一</option>
<option value="A">石橋脩</option>
<option value="A">大野拓弥</option>
<option value="A">丸山元気</option>
<option value="A">津村明秀</option>

<option value="B">丹内祐次</option>
<option value="B">菱田裕二</option>
<option value="B">斎藤新</option>
<option value="B">亀田温心</option>
<option value="B">小沢大仁</option>
<option value="B">角田大河</option>
<option value="B">今村聖奈</option>
<option value="B">永島まなみ</option>
<option value="B">古川吉洋</option>
<option value="B">国分恭介</option>
<option value="B">国分優作</option>
<option value="B">柴田大知</option>
<option value="B">水口優也</option>

<option value="C">新人騎手</option>
<option value="C">減量騎手</option>
<option value="C">地方騎手</option>

</select>

<label>⑧ 2番人気 騎手</label>
<select id="j2">
<!-- 同じ内容 -->
<option value="S">C.ルメール</option>
<option value="S">川田将雅</option>
<option value="S">戸崎圭太</option>
<option value="S">武豊</option>
<option value="S">横山武史</option>
<option value="S">松山弘平</option>

<option value="A">坂井瑠星</option>
<option value="A">菅原明良</option>
<option value="A">岩田望来</option>
<option value="A">田辺裕信</option>
<option value="A">和田竜二</option>
<option value="A">幸英明</option>
<option value="A">三浦皇成</option>
<option value="A">横山和生</option>
<option value="A">藤岡佑介</option>
<option value="A">鮫島克駿</option>
<option value="A">北村友一</option>
<option value="A">石橋脩</option>
<option value="A">大野拓弥</option>
<option value="A">丸山元気</option>
<option value="A">津村明秀</option>

<option value="B">丹内祐次</option>
<option value="B">菱田裕二</option>
<option value="B">斎藤新</option>
<option value="B">亀田温心</option>
<option value="B">小沢大仁</option>
<option value="B">角田大河</option>
<option value="B">今村聖奈</option>
<option value="B">永島まなみ</option>
<option value="B">古川吉洋</option>
<option value="B">国分恭介</option>
<option value="B">国分優作</option>
<option value="B">柴田大知</option>
<option value="B">水口優也</option>

<option value="C">新人騎手</option>
<option value="C">減量騎手</option>
<option value="C">地方騎手</option>

</select>

<button onclick="calc()">判定する</button>

<div class="box" id="out"></div>

<script>

function rank(val){
if(val==="S") return 20;
if(val==="A") return 10;
if(val==="B") return 3;
return -10;
}

function calc(){

let head = document.getElementById("head").value;
let r1 = parseInt(document.getElementById("r1").value);
let r2 = parseInt(document.getElementById("r2").value);
let r3 = parseInt(document.getElementById("r3").value);
let o1 = parseFloat(document.getElementById("o1").value);
let o2 = parseFloat(document.getElementById("o2").value);
let j1 = document.getElementById("j1").value;
let j2 = document.getElementById("j2").value;

let score = 50;
let diff = o2 - o1;

// オッズ差
if(diff >= 3.5) score += 20;
else if(diff < 2.5) score -= 10;

// 騎手
score += rank(j1);
score += rank(j2);

// 枠
if(r1 <= 4) score += 10;
if(r2 <= 4) score += 5;

// 頭数
if(head==="large") score -= 5;
if(head==="small") score += 5;

// 3強
let type = r3 ? "3強型" : "2強型";

// 買い目
let bet = "";

if(score >= 80){
bet = `◎ ${r1}-${r2}\n○ ${r1}-${r3}`;
}else if(score >= 60){
bet = `◎ ${r1}-${r2}\n○ ${r1}-${r3}\n▲ ${r2}-${r3}`;
}else{
bet = `◎ ${r1}-${r2}`;
}

document.getElementById("out").innerText =
`【判定】\nタイプ：${type}\nスコア：${score}\n\n【買い目】\n${bet}`;

}

</script>

</body>
</html>
