<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>枠連 自動投資ツール</title>
<style>
body { font-family: sans-serif; padding: 15px; background:#111; color:#fff; }
input, select { width: 100%; padding: 10px; margin: 8px 0; }
button { width: 100%; padding: 12px; background: #00c853; color: #fff; border: none; font-size: 16px; }
.box { margin-top: 15px; padding: 10px; background:#222; border-radius:8px; white-space:pre-line; }
</style>
</head>
<body>

<h2>枠連 自動判定ツール</h2>

<label>① 出走頭数</label>
<select id="head">
<option value="small">8〜10頭</option>
<option value="mid">11〜14頭</option>
<option value="large">15〜18頭</option>
</select>

<label>② 1番人気の枠</label>
<input type="number" id="r1" min="1" max="8">

<label>③ 2番人気の枠</label>
<input type="number" id="r2" min="1" max="8">

<label>④ 3番人気の枠</label>
<input type="number" id="r3" min="1" max="8">

<label>⑤ 1番人気オッズ</label>
<input type="number" id="o1" step="0.1">

<label>⑥ 2番人気オッズ</label>
<input type="number" id="o2" step="0.1">

<hr>

<label>⑦ 1番人気 騎手</label>
<select id="j1">
<option value="strong">ルメール</option>
<option value="strong">川田将雅</option>
<option value="strong">武豊</option>
<option value="strong">戸崎圭太</option>
<option value="strong">横山武史</option>
<option value="strong">松山弘平</option>

<option value="normal">田辺裕信</option>
<option value="normal">三浦皇成</option>
<option value="normal">菅原明良</option>
<option value="normal">岩田望来</option>

<option value="weak">新人騎手</option>
<option value="weak">減量騎手</option>
<option value="weak">地方騎手</option>
</select>

<label>⑧ 2番人気 騎手</label>
<select id="j2">
<option value="strong">ルメール</option>
<option value="strong">川田将雅</option>
<option value="strong">武豊</option>
<option value="strong">戸崎圭太</option>
<option value="strong">横山武史</option>
<option value="strong">松山弘平</option>

<option value="normal">田辺裕信</option>
<option value="normal">三浦皇成</option>
<option value="normal">菅原明良</option>
<option value="normal">岩田望来</option>

<option value="weak">新人騎手</option>
<option value="weak">減量騎手</option>
<option value="weak">地方騎手</option>
</select>

<button onclick="calc()">判定する</button>

<div class="box" id="out"></div>

<script>
function calc(){

let head = document.getElementById("head").value;
let r1 = parseInt(document.getElementById("r1").value);
let r2 = parseInt(document.getElementById("r2").value);
let r3 = parseInt(document.getElementById("r3").value);
let o1 = parseFloat(document.getElementById("o1").value);
let o2 = parseFloat(document.getElementById("o2").value);
let j1 = document.getElementById("j1").value;
let j2 = document.getElementById("j2").value;

let diff = o2 - o1;

let score = 50;

// オッズ差
if(diff >= 3.5) score += 20;
else if(diff < 2.5) score -= 10;

// 騎手補正
if(j1 === "strong") score += 20;
if(j1 === "normal") score += 5;
if(j1 === "weak") score -= 15;

if(j2 === "strong") score += 15;
if(j2 === "normal") score += 3;
if(j2 === "weak") score -= 10;

// 枠補正
if(r1 <= 4) score += 10;
if(r2 <= 4) score += 5;

// 3強判定
let type = r3 ? "3強型" : "2強型";

// 頭数補正
if(head === "large") score -= 5;
if(head === "small") score += 5;

// 買い目
let bet = "";

if(score >= 80){
    bet = `◎ ${r1}-${r2}\n○ ${r1}-${r3}`;
}else if(score >= 60){
    bet = `◎ ${r1}-${r2}\n○ ${r1}-${r3}\n▲ ${r2}-${r3}`;
}else{
    bet = `◎ ${r1}-${r2}`;
}

document.getElementById("out").innerText =
`【判定】\n` +
`タイプ：${type}\n` +
`スコア：${score}\n\n` +
`【買い目】\n${bet}`;

}
</script>

</body>
</html>
