<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>馬連期待値ツール（期待値下限除外版）</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; padding: 10px; background: #f5f5f5; }
  h2 { text-align: center; }
  input, select, button, textarea { font-size: 16px; margin: 4px 0; padding: 6px; width: 100%; }
  .section { background: #fff; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  .result { background: #e0f7fa; padding: 10px; margin-top: 10px; border-radius: 8px; }
</style>
</head>
<body>

<h2>馬連期待値計算ツール（期待値下限除外版）</h2>

<div class="section">
  <label>単勝オッズ（コピペ可、空白改行OK）</label>
  <textarea id="oddsInput" rows="10" placeholder="例：&#10;2.1&#10;2.6&#10;3.5"></textarea>
</div>

<div class="section">
  <label>馬連オッズ（プルダウン 0.1刻み、任意）</label>
  <label>1-4</label>
  <select id="umaren14"></select>
  <label>1-5</label>
  <select id="umaren15"></select>
  <label>2-4</label>
  <select id="umaren24"></select>
  <label>2-5</label>
  <select id="umaren25"></select>
</div>

<div class="section">
  <label>開催場</label>
  <select id="course">
    <option value="sapporo">札幌</option>
    <option value="hakodate">函館</option>
    <option value="fukushima">福島</option>
    <option value="niigata">新潟</option>
    <option value="tokyo">東京</option>
    <option value="nakayama">中山</option>
    <option value="chukyo">中京</option>
    <option value="kyoto">京都</option>
    <option value="hanshin">阪神</option>
    <option value="kokura">小倉</option>
  </select>

  <label>芝 / ダート</label>
  <select id="surface">
    <option value="turf">芝</option>
    <option value="dirt">ダート</option>
  </select>

  <label>距離</label>
  <select id="distance">
    <option value="short">短距離【1000m〜1400m】</option>
    <option value="mile">マイル【1401m〜1800m】</option>
    <option value="medium">中距離【1801m〜2200m】</option>
    <option value="long">長距離【2201m以上】</option>
  </select>
</div>

<div class="section">
  <button onclick="calculate()">期待値計算</button>
  <button onclick="resetInput()">リセット</button>
</div>

<div id="result" class="result"></div>

<script>
// プルダウン0.1刻み初期化
function initPluldown() {
  const selects = ['umaren14','umaren15','umaren24','umaren25'];
  selects.forEach(id=>{
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">自動</option>';
    for(let i=1.0;i<=50.0;i+=0.1){
      const val = i.toFixed(1);
      sel.innerHTML += `<option value="${val}">${val}</option>`;
    }
  });
}

// リセット
function resetInput() {
  document.getElementById('oddsInput').value = '';
  ['umaren14','umaren15','umaren24','umaren25'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('result').innerHTML = '';
}

// 人気別連対率（実データ）
const rankRate = [0.514,0.382,0.292,0.200,0.161,0.126,0.093,0.075,0.057,0.038,0.032,0.018,0.018,0.007,0.010,0.003,0.003,0.003];

// 開催場係数
const courseFactor = {
  sapporo: 1.02, hakodate: 0.97, fukushima: 0.92, niigata: 0.95,
  tokyo: 1.05, nakayama: 0.98, chukyo: 1.00, kyoto: 1.02,
  hanshin: 1.00, kokura: 0.93
};

// 芝/ダート補正
const surfaceFactor = { turf:1.05, dirt:0.95 };

// 距離補正
const distanceFactor = { short:0.95, mile:1.02, medium:1.05, long:0.97 };

// 最低期待値（EV）フィルター
const EV_MIN = 100;

function calculate() {
  const input = document.getElementById('oddsInput').value;
  if(!input) return alert('単勝オッズを入力してください');

  let odds = input.split(/\s+/).map(s=>parseFloat(s)).filter(n=>!isNaN(n));
  const headCount = odds.length;
  if(headCount<5) return alert('5頭以上のオッズが必要です');

  const axes = [0,1]; // 1,2人気
  const others = [3,4]; // 4,5人気

  const d = odds[1]/odds[0];
  if(d<1.8) {
    document.getElementById('result').innerHTML = '<b>断層未達 → 見送り</b>';
    return;
  }

  const course = document.getElementById('course').value;
  const surface = document.getElementById('surface').value;
  const distance = document.getElementById('distance').value;
  const fCourse = courseFactor[course];
  const fSurface = surfaceFactor[surface];
  const fDistance = distanceFactor[distance];
  const fHead = 16/headCount;
  const fStalk = 1 + (d-1)*0.35;
  const fBasic = 0.8;

  const umarenInputs = [
    parseFloat(document.getElementById('umaren14').value),
    parseFloat(document.getElementById('umaren15').value),
    parseFloat(document.getElementById('umaren24').value),
    parseFloat(document.getElementById('umaren25').value)
  ];

  // 買い目計算
  let bets = [];
  let idx = 0;
  axes.forEach(a=>{
    others.forEach(b=>{
      let P = rankRate[a]*rankRate[b]*fBasic*fStalk*fHead*fSurface*fCourse*fDistance;
      let O = umarenInputs[idx];
      if(isNaN(O)) O = (odds[a]+odds[b])/2;
      bets.push({pair:`${a+1}-${b+1}`,P:P,odds:O});
      idx++;
    });
  });

  // 期待値下限で除外
  bets = bets.filter(b=> (b.P*b.odds*100) >= EV_MIN ); // 仮に初期投資100円換算

  if(bets.length===0){
    document.getElementById('result').innerHTML = '<b>有効な買い目なし（期待値が低すぎ）</b>';
    return;
  }

  // 総的中率
  let totalP = 1;
  bets.forEach(b=>totalP *= (1-b.P));
  totalP = 1 - totalP;

  // 投資配分（期待値比例、100円単位）
  const totalBudget = 1500;
  const totalEV = bets.reduce((sum,b)=>sum+b.P*b.odds,0);
  bets.forEach(b=>{
    b.invest = Math.floor(totalBudget*(b.P*b.odds/totalEV)/100)*100;
    b.EV = b.P*b.odds*b.invest;
  });

  // 結果表示
  let html = `<b>断層 ${d.toFixed(2)} / 総想定的中率 ${(totalP*100).toFixed(1)}%</b><br>`;
  html += `<table><tr><th>買い目</th><th>投資額</th><th>期待値(円)</th><th>想定的中率(%)</th></tr>`;
  bets.forEach(b=>{
    html += `<tr><td>${b.pair}</td><td>${b.invest}</td><td>${b.EV.toFixed(0)}</td><td>${(b.P*100).toFixed(1)}</td></tr>`;
  });
  html += `</table>`;
  document.getElementById('result').innerHTML = html;
}

initPluldown();
</script>

</body>
</html>
