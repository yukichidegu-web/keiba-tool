<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中央競馬ワイドEVプロ 完全UI版</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;padding:15px}
textarea,input,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none;font-size:16px}
button{background:#00c853;color:#000;font-weight:bold}
.result{margin-top:15px;padding:12px;background:#222;border-radius:10px}
.hidden{display:none}
.clearBtn{background:#ff5252;color:#fff}
.stop{color:#ff5252;font-weight:bold}
</style>
</head>
<body>

<h2>中央競馬 ワイドEVプロ（完全UI版）</h2>

<h3>単勝オッズ（改行貼付）</h3>
<textarea id="oddsInput" rows="8"></textarea>

<button onclick="detectAxis()">軸判定</button>

<div id="axisArea" class="hidden">
<h3 id="axisTitle"></h3>

<div id="wideInputs"></div>

<button onclick="calculate()">判定</button>
<button onclick="clearAll()" class="clearBtn">クリア</button>
</div>

<div class="result" id="output"></div>

<script>

let bankroll=30000;
let startMonthBank=30000;
let todayLoss=0;
let axis=null;
let strong=false;

const placeRate={1:0.65,2:0.55,3:0.45,4:0.38,5:0.30,6:0.24,7:0.20};

function detectAxis(){

let raw=oddsInput.value.trim().split(/\n+/);
let odds={};
raw.forEach((v,i)=> odds[i+1]=parseFloat(v));

let fault=null;
strong=false;

for(let i=2;i<=raw.length;i++){
if(!odds[i-1]||!odds[i])continue;
let ratio=odds[i]/odds[i-1];
if(ratio>=2.0){
fault=i-1;
if(ratio>=2.5) strong=true;
break;
}
}

if(!fault){
output.innerHTML="断層なし → 見送り";
return;
}

// EV比較用仮軸
axis=(fault<=3)?fault:2;

document.getElementById("axisArea").classList.remove("hidden");
document.getElementById("axisTitle").innerHTML="採用軸候補："+axis+"番人気";

let html="";
[5,6,7].forEach(n=>{
html+=`<input type="number" id="w${axis}${n}" placeholder="${axis}-${n}">`;
});
document.getElementById("wideInputs").innerHTML=html;
}

function calculate(){

if(bankroll<=startMonthBank*0.85){
output.innerHTML="<span class='stop'>月間停止</span>";
return;
}

let threshold=strong?1.10:1.20;
let minWide=(axis===2?8:10);
if(strong) minWide-=2;

let bets=[];

[5,6,7].forEach(n=>{
let val=parseFloat(document.getElementById("w"+axis+n).value);
if(!val||val<minWide)return;

let diff=n-axis;
let decay=diff>=3?0.75:0.80;
let hit=placeRate[axis]*placeRate[n]*decay;
let ev=hit*val;
if(ev<threshold)return;

let bOdds=val-1;
let f=((bOdds*hit)-(1-hit))/bOdds;
f=f*0.5;
if(f<=0)return;

bets.push({pair:axis+"-"+n,ev:ev,f:f});
});

if(bets.length===0){
output.innerHTML="EV不足 → 見送り";
return;
}

bets.sort((a,b)=>b.ev-a.ev);
bets=bets.slice(0,2);

let raceMax=bankroll*0.03;
let totalStake=0;
let result="<b>資金：</b>"+Math.round(bankroll)+"円<br>";

bets.forEach(b=>{
let stake=Math.floor(bankroll*b.f/100)*100;
if(stake<100)stake=100;
totalStake+=stake;
b.stake=stake;
});

if(totalStake>raceMax){
let ratio=raceMax/totalStake;
bets.forEach(b=>{
b.stake=Math.floor((b.stake*ratio)/100)*100;
});
totalStake=raceMax;
}

bets.forEach(b=>{
result+=b.pair+" | EV:"+b.ev.toFixed(2)+" | 投資:"+b.stake+"円<br>";
});

result+="<br><b>最大投資：</b>"+Math.round(totalStake)+"円";
output.innerHTML=result;

todayLoss+=totalStake;
}

function clearAll(){
oddsInput.value="";
document.getElementById("axisArea").classList.add("hidden");
output.innerHTML="";
}

</script>

</body>
</html>
