<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中央競馬ワイドEVプロ150%</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#fff;padding:15px}
input,select,button{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:none;font-size:16px}
button{background:#00c853;color:#000;font-weight:bold}
.result{margin-top:15px;padding:12px;background:#222;border-radius:8px}
</style>
</head>
<body>

<h2>中央競馬 ワイドEVプロ（月150%仕様）</h2>

<label>開催場</label>
<select id="track">
<option value="tokyo">東京・京都</option>
<option value="nakayama">中山・阪神</option>
<option value="chukyo">中京</option>
<option value="fukushima">福島・新潟</option>
<option value="kokura">小倉・札幌・函館</option>
</select>

<label>断層あり？</label>
<select id="layer">
<option value="1.05">あり</option>
<option value="1.00">なし</option>
</select>

<h3>ワイドオッズ入力</h3>
<input type="number" id="o25" placeholder="2-5">
<input type="number" id="o26" placeholder="2-6">
<input type="number" id="o27" placeholder="2-7">
<input type="number" id="o35" placeholder="3-5">
<input type="number" id="o36" placeholder="3-6">
<input type="number" id="o37" placeholder="3-7">

<button onclick="calculate()">判定</button>
<button onclick="clearAll()" style="background:#ff5252;color:#fff;">クリア</button>

<div class="result" id="output"></div>

<script>

const rateTable = {
tokyo:{r2:0.62,r3:0.52,r5:0.30,r6:0.24,r7:0.19,trackCoef:0.88},
nakayama:{r2:0.60,r3:0.50,r5:0.33,r6:0.27,r7:0.22,trackCoef:0.90},
chukyo:{r2:0.58,r3:0.48,r5:0.35,r6:0.29,r7:0.24,trackCoef:0.91},
fukushima:{r2:0.56,r3:0.46,r5:0.37,r6:0.31,r7:0.26,trackCoef:0.93},
kokura:{r2:0.54,r3:0.44,r5:0.39,r6:0.33,r7:0.28,trackCoef:0.95}
};

function calculate(){

let trackKey=document.getElementById("track").value;
let layer=parseFloat(document.getElementById("layer").value);
let data=rateTable[trackKey];

let r2=data.r2,r3=data.r3,r5=data.r5,r6=data.r6,r7=data.r7;
let trackCoef=data.trackCoef;

function calc(axis,opp,odds){
if(!odds) return null;
let hit=axis*opp*trackCoef*layer;
let ev=(hit*odds)-1;
return {hit,ev,odds};
}

let rawBets=[
{axis:2,pair:"2-5",data:calc(r2,r5,parseFloat(o25.value))},
{axis:2,pair:"2-6",data:calc(r2,r6,parseFloat(o26.value))},
{axis:2,pair:"2-7",data:calc(r2,r7,parseFloat(o27.value))},
{axis:3,pair:"3-5",data:calc(r3,r5,parseFloat(o35.value))},
{axis:3,pair:"3-6",data:calc(r3,r6,parseFloat(o36.value))},
{axis:3,pair:"3-7",data:calc(r3,r7,parseFloat(o37.value))}
];

let bets=rawBets.filter(b=>b.data && b.data.ev>0.10);

if(bets.length===0){
document.getElementById("output").innerHTML="EV>0.10なし → SKIP";
return;
}

bets.sort((a,b)=>b.data.ev-a.data.ev);

let selectedAxis=bets[0].axis;
bets=bets.filter(b=>b.axis===selectedAxis).slice(0,6);

let totalEV=bets.reduce((sum,b)=>sum+b.data.ev,0);

let output="<b>採用軸：</b>"+selectedAxis+"番人気<br><br>";

let totalExpectedReturn=0;

bets.forEach(b=>{
let stake=Math.round((b.data.ev/totalEV)*1500/100)*100;
let expected=b.data.hit*b.data.odds*stake;
totalExpectedReturn+=expected;
output+=b.pair+
" | EV:"+b.data.ev.toFixed(2)+
" | 投資:"+stake+"円<br>";
});

let raceReturnRate=((totalExpectedReturn/1500)*100).toFixed(1);

output+="<br><b>レース理論回収率：</b>"+raceReturnRate+"%<br>";
output+="<b>判定：BUY</b>";

document.getElementById("output").innerHTML=output;
}

function clearAll(){
document.querySelectorAll("input").forEach(i=>i.value="");
document.getElementById("output").innerHTML="";
}

</script>

</body>
</html>
